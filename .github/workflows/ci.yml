name: CI

# Tests and builds only. This workflow never deploys, never touches the production
# database and never sends email: Resend/SMTP/WhatsApp are mocked and all outbound
# HTTP/SMTP is blocked by backend/tests/conftest.py.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database for the PostgreSQL migration test. Never production.
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      # Empty on purpose: no real provider credentials ever exist in CI.
      RESEND_API_KEY: ""
      RESEND_WEBHOOK_SECRET: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (incl. psycopg[binary] PostgreSQL driver)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Check the PostgreSQL driver loads
        run: python -c "import psycopg; print('psycopg', psycopg.__version__, psycopg.pq.__impl__)"
      - name: Run backend test suite
        run: python -m pytest tests -v -rA

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        # package-lock.json is gitignored in this repo, so `npm ci` is not possible.
        run: npm install --no-audit --no-fund
      - name: Build
        env:
          VITE_API_URL: https://ai-portfolio-8wpd.onrender.com
        run: npm run build
